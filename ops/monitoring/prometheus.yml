global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: nearby-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000

  - job_name: nearby-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: nearby-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
