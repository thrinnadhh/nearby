<style>

    --paper: #FAFAF7;
    --surface: #FFFFFF;
    --line: #E6E4DE;
    --line-2: #EFEDE6;

    --accent: #2563EB;           /* cool blue accent */
    --success: #15803D;
    --success-soft: #DCFCE7;
    --warn: #B45309;
    --warn-soft: #FEF3C7;
    --danger: #B91C1C;
    --danger-soft: #FEE2E2;
    --highlight: #F4F2EC;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink);

  .display { font-family: 'Inter Tight', system-ui, sans-serif; letter-spacing: -0.015em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .brand-mark {

  .nav-item:hover { background: #25241F; color: #FAFAF7; }

  .tbl tr:last-child td { border-bottom: 0; }
  .shop-cell { display: flex; align-items: center; gap: 10px; }
  .shop-thumb { width: 34px; height: 34px; border-radius: 7px;

  .pill.green { background: var(--success-soft); color: var(--success); }
  .pill.amber { background: var(--warn-soft); color: var(--warn); }
  .pill.red { background: var(--danger-soft); color: var(--danger); }
  .pill.gray { background: var(--paper); color: var(--mute); border: 1px solid var(--line); }

  .toggle { width: 36px; height: 20px; border-radius: 999px; background: var(--line);
    position: relative; cursor: pointer; border: 0; padding: 0; }
  .toggle.on { background: var(--success); }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px;

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; background: var(--surface);

  .drawer.open { transform: translateX(0); }
  .scrim { position: fixed; inset: 0; background: rgba(20,20,20,0.32); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 40; }
  .scrim.show { opacity: 1; pointer-events: auto; }

  /* Featured/Trending pickers */
  .slot { border: 1.5px dashed var(--line); border-radius: 9px; padding: 10px 12px; min-height: 60px;
    display: flex; align-items: center; gap: 10px; }
  .slot.filled { border-style: solid; background: var(--paper); }
  .slot .x { margin-left: auto; cursor: pointer; color: var(--mute); font-size: 14px;

  .slot .x:hover { background: var(--line-2); color: var(--ink); }
  .grip { color: var(--mute-2); cursor: grab; font-size: 14px; }

  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label { font-size: 11.5px; color: var(--mute); font-weight: 600;

  .form-row input, .form-row select { padding: 8px 10px; border: 1px solid var(--line);

  .form-row input:focus, .form-row select:focus { border-color: var(--ink); }

  /* Right rail empty state */
  .empty { padding: 20px; text-align: center; color: var(--mute); font-size: 12px; }

  /* Stat cluster */
  .stat-cluster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border-top: 1px solid var(--line-2); }
  .stat-cluster > div { padding: 12px 16px; border-right: 1px solid var(--line-2); }
  .stat-cluster > div:last-child { border-right: 0; }
  .stat-cluster .k { font-size: 11px; color: var(--mute); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-cluster .v { font-family: 'Inter Tight'; font-size: 18px; font-weight: 700; margin-top: 2px;
    font-variant-numeric: tabular-nums; }
</style>

const DEFAULT_API_BASE = localStorage.getItem("nearby_admin_api_base_url") || "http://localhost:3000/api/v1";

// ─── API layer ─────────────────────────────────────────────────────────────
function getAdminToken() {
  return localStorage.getItem("nearby_admin_token") || localStorage.getItem("admin_token") || "";
}

function setAdminToken(token) {
  if (!token) {
    localStorage.removeItem("nearby_admin_token");
    return;
  }
  localStorage.setItem("nearby_admin_token", token);
}

function setAdminApiBase(baseUrl) {
  localStorage.setItem("nearby_admin_api_base_url", baseUrl);
}

async function apiRequest(path, { method = "GET", body, params } = {}) {
  const baseUrl = localStorage.getItem("nearby_admin_api_base_url") || DEFAULT_API_BASE;
  const url = new URL(path, `${baseUrl.replace(/\/$/, "")}/`);
  if (params) {
    Object.entries(params).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") {
        url.searchParams.set(key, value);
      }
    });
  }

  const token = getAdminToken();
  const response = await fetch(url.toString(), {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });

  const payload = await response.json().catch(() => ({
    success: false,
    error: { message: `Request failed with status ${response.status}` },
  }));

  if (!response.ok || payload.success === false) {
    const message = payload?.error?.message || `Request failed with status ${response.status}`;
    throw new Error(message);
  }

  return payload.data;
}

function useApiResource(loader, deps) {
  const [state, setState] = React.useState({
    loading: true,
    error: null,
    data: null,
  });

  const reload = React.useCallback(async () => {
    setState(s => ({ ...s, loading: true, error: null }));
    try {
      const data = await loader();
      setState({ loading: false, error: null, data });
    } catch (error) {
      setState({ loading: false, error: error.message || "Unknown error", data: null });
    }
  }, deps);

  React.useEffect(() => {
    reload();
  }, [reload]);

  return { ...state, reload };
}

// ─── Helpers ────────────────────────────────────────────────────────────────
function formatINR(n) {
  if (n == null) return "";
  const s = Math.round(n).toString();
  if (s.length <= 3) return "₹" + s;
  const last3 = s.slice(-3);
  const rest = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",");
  return "₹" + rest + "," + last3;
}
const initial = (s) => (s || "?").trim()[0].toUpperCase();

function Chart({ source }) {
  const W = 760, H = 200, PT = 18, PB = 26, PL = 24, PR = 12;
  const data = source && source.length
    ? source.map((row, index) => ({ h: index, orders: row.orders_count || 0 }))
    : HOURS;
  const max = Math.max(...data.map(d => d.orders)) * 1.1;
  const stepX = (W - PL - PR) / (data.length - 1);
  const yFor = v => H - PB - (v / max) * (H - PT - PB);
  const xFor = i => PL + i * stepX;

  // average band (mock)
  const avg = data.map((d, i) => ({ x: xFor(i), y: yFor(d.orders * 0.85) }));
  const pts = data.map((d, i) => ({ x: xFor(i), y: yFor(d.orders) }));
  const pathLine = pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  const pathAvg = avg.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  const pathFill = pathLine + ` L ${pts[pts.length-1].x} ${H-PB} L ${pts[0].x} ${H-PB} Z`;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      <defs>
        <linearGradient id="ofill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1F1F1E" stopOpacity="0.18" />
          <stop offset="100%" stopColor="#1F1F1E" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75].map(g => (
        <line key={g} x1={PL} x2={W-PR}
              y1={PT + (H - PT - PB) * g} y2={PT + (H - PT - PB) * g}
              stroke="#EFEDE6" strokeDasharray="3 4" />
      ))}
      <path d={pathAvg} fill="none" stroke="#2563EB" strokeOpacity=".5"
            strokeWidth="1.5" strokeDasharray="4 4" />
      <path d={pathFill} fill="url(#ofill)" />
      <path d={pathLine} fill="none" stroke="#1F1F1E" strokeWidth="2"
            strokeLinejoin="round" strokeLinecap="round" />
      {[0, 6, 12, 18, 23].map(h => (
        <text key={h} x={xFor(h)} y={H - 8} textAnchor="middle"
              fontSize="10.5" fill="#76746C" fontFamily="JetBrains Mono">
          {h === 0 ? "12a" : h === 12 ? "12p" : h > 12 ? `${h-12}p` : `${h}a`}
        </text>
      ))}
    </svg>
  );
}

// ─── Featured / Trending pickers ────────────────────────────────────────────
function FeaturedTrending({ mode, picks, setPicks, allShops }) {
  // mode: "featured" (3 slots) | "trending" (5 slots)
  const SLOTS = mode === "featured" ? 3 : 5;
  const [filter, setFilter] = React.useState("");
  const [autoRotate, setAutoRotate] = React.useState(mode === "trending");

  const pickedSet = new Set(picks);
  const candidates = allShops
    .filter(s => !pickedSet.has(s.id))
    .filter(s => filter === "" || (s.name + s.area + s.cat).toLowerCase().includes(filter.toLowerCase()));

  function add(id) {
    if (picks.length >= SLOTS) return;
    setPicks([...picks, id]);
  }
  function remove(id) { setPicks(picks.filter(p => p !== id)); }
  function moveUp(i) {
    if (i === 0) return;
    const next = [...picks]; [next[i-1], next[i]] = [next[i], next[i-1]]; setPicks(next);
  }
  function moveDown(i) {
    if (i === picks.length - 1) return;
    const next = [...picks]; [next[i+1], next[i]] = [next[i], next[i+1]]; setPicks(next);
  }

  const titles = mode === "featured"
    ? { h1: "Featured shops", sub: "Hand-picked. Appear at the top of every customer's home feed in their city. Rotate weekly for fairness." }
    : { h1: "Trending shops", sub: "Editorial trending row. Up to 5 slots. Auto-rotation can hand off to the algorithm at midnight." };

  return (
    <>
      <div className="h1-row">
        <div>
          <div className="h1">{titles.h1}</div>
          <div className="h1-sub">{titles.sub}</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="ghost-btn">Preview in app</button>
          <button className="primary-btn">Publish · {picks.length}/{SLOTS}</button>
        </div>
      </div>

      <div className="grid-2" style={{ gridTemplateColumns: "1fr 1fr" }}>
        {/* Left: slots */}
        <div className="card">
          <div className="card-hd">
            <div>
              <div className="card-title">Active slots</div>
              <div className="card-sub">{picks.length} of {SLOTS} filled · drag to reorder</div>
            </div>
            {mode === "trending" && (
              <button className={`toggle ${autoRotate ? "on" : ""}`} onClick={() => setAutoRotate(!autoRotate)} />
            )}
          </div>
          <div style={{ padding: "4px 16px 16px", display: "flex", flexDirection: "column", gap: 8 }}>
            {Array.from({ length: SLOTS }).map((_, i) => {
              const id = picks[i];
              const s = id ? allShops.find(x => x.id === id) : null;
              return (
                <div key={i} className={`slot ${s ? "filled" : ""}`}>
                  <span style={{ fontSize: 11, color: "var(--mute)", fontWeight: 700, width: 18 }}>{i + 1}</span>
                  {s ? (
                    <>
                      <span className="grip">⋮⋮</span>
                      <div className="shop-thumb" style={{ background: s.hue, width: 30, height: 30, fontSize: 12 }}>{initial(s.name)}</div>
                      <div style={{ minWidth: 0 }}>
                        <div className="shop-name" style={{ fontSize: 13 }}>{s.name}</div>
                        <div className="shop-loc">{s.area} · trust {s.trust}</div>
                      </div>
                      <div style={{ display: "flex", gap: 2, marginLeft: "auto" }}>
                        <button className="ghost-btn" onClick={() => moveUp(i)} title="Move up">↑</button>
                        <button className="ghost-btn" onClick={() => moveDown(i)} title="Move down">↓</button>
                        <span className="x" onClick={() => remove(s.id)} title="Remove">✕</span>
                      </div>
                    </>
                  ) : (
                    <span style={{ color: "var(--mute)", fontSize: 12.5 }}>Empty slot — pick a shop from the right</span>
                  )}
                </div>
              );
            })}
          </div>
          <div className="stat-cluster">
            <div><div className="k">Reach (est.)</div><div className="v">{(picks.length * 84).toLocaleString("en-IN")}k</div></div>
            <div><div className="k">Last published</div><div className="v" style={{ fontSize: 14 }}>2 days ago</div></div>
            <div><div className="k">Schedule</div><div className="v" style={{ fontSize: 14 }}>{mode === "trending" ? "Daily 00:00" : "Weekly Mon"}</div></div>
          </div>
        </div>

        {/* Right: candidate picker */}
        <div className="card">
          <div className="card-hd">
            <div>
              <div className="card-title">Candidates</div>
              <div className="card-sub">{candidates.length} eligible shops</div>
            </div>
          </div>
          <div style={{ padding: "0 14px 12px" }}>
            <div className="search" style={{ width: "100%", margin: 0 }}>
              <span>🔍</span>
              <input value={filter} onChange={e => setFilter(e.target.value)}
                     placeholder="Filter by name, city, category…"
                     style={{ flex: 1, border: 0, outline: 0, background: "transparent", color: "var(--ink)", font: "inherit" }} />
            </div>
          </div>
          <div style={{ maxHeight: 460, overflowY: "auto" }}>
            {candidates.map(s => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10,
                                       padding: "10px 16px", borderTop: "1px solid var(--line-2)" }}>
                <div className="shop-thumb" style={{ background: s.hue, width: 30, height: 30, fontSize: 12 }}>{initial(s.name)}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{s.name}</div>
                  <div className="shop-loc">{s.area} · {s.cat}</div>
                </div>
                <span className={`pill ${s.trust >= 95 ? "green" : s.trust >= 85 ? "amber" : "red"}`}>
                  {s.trust}
                </span>
                <button className="ghost-btn" onClick={() => add(s.id)} disabled={picks.length >= SLOTS}>
                  {picks.length >= SLOTS ? "Full" : "Add"}
                </button>
              </div>
            ))}
            {candidates.length === 0 && (
              <div className="empty">No shops match that filter.</div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

function ShopsSection({ shops, setShops }) {
  const api = useApiResource(() => apiRequest("admin/shops", { params: { page: 1, limit: 50 } }), []);
  const [tab, setTab] = React.useState("all");
  const [drawerShop, setDrawerShop] = React.useState(null);
  const liveShops = api.data?.shops
    ? api.data.shops.map((shop, index) => ({
        id: shop.id,
        name: shop.name,
        area: shop.phone || "Live backend data",
        cat: shop.category,
        trust: Math.round(Number(shop.trust_score || 0)),
        orders: 0,
        rev: 0,
        online: !!shop.is_open,
        hue: ALL_SHOPS[index % ALL_SHOPS.length]?.hue || "#2563EB",
      }))
    : shops;
  const filtered = tab === "all" ? liveShops :
                   tab === "online" ? liveShops.filter(s => s.online) :
                   tab === "offline" ? liveShops.filter(s => !s.online) :
                   liveShops.filter(s => s.trust < 90);

  async function toggleOnline(id, currentOnline) {
    try {
      if (currentOnline) {
        await apiRequest(`admin/shops/${id}/suspend`, {
          method: "PATCH",
          body: { reason: "Suspended from standalone admin dashboard prototype" },
        });
      } else {
        await apiRequest(`admin/shops/${id}/reinstate`, {
          method: "PATCH",
        });
      }
      api.reload();
    } catch (error) {
      alert(error.message);
    }
  }

  if (api.loading) return <LoadingCard title="Loading shops…" />;
  if (api.error) return <ErrorCard error={api.error} onRetry={api.reload} />;

  return (
    <>
      <div className="h1-row">
        <div>
          <div className="h1">Shops</div>
          <div className="h1-sub">Loaded from /admin/shops</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="ghost-btn">Export</button>
          <button className="primary-btn">+ Onboard new shop</button>
        </div>
      </div>

      <div className="card">
        <div className="tab-row">
          <button className={`tab ${tab==="all" ? "on" : ""}`} onClick={() => setTab("all")}>All · {liveShops.length}</button>
          <button className={`tab ${tab==="online" ? "on" : ""}`} onClick={() => setTab("online")}>Online · {liveShops.filter(s=>s.online).length}</button>
          <button className={`tab ${tab==="offline" ? "on" : ""}`} onClick={() => setTab("offline")}>Offline · {liveShops.filter(s=>!s.online).length}</button>
          <button className={`tab ${tab==="lowtrust" ? "on" : ""}`} onClick={() => setTab("lowtrust")}>Low trust · {liveShops.filter(s=>s.trust<90).length}</button>
        </div>
        <ShopsTable shops={filtered} onSelect={setDrawerShop} onToggleOnline={(id) => {
          const shop = liveShops.find(s => s.id === id);
          toggleOnline(id, shop?.online);
        }} />
      </div>

      <div className={`scrim ${drawerShop ? "show" : ""}`} onClick={() => setDrawerShop(null)} />
      <div className={`drawer ${drawerShop ? "open" : ""}`}>
        {drawerShop && (
          <>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 12 }}>
              <div className="shop-thumb" style={{ background: drawerShop.hue, width: 42, height: 42, fontSize: 18 }}>{initial(drawerShop.name)}</div>
              <div style={{ flex: 1 }}>
                <div className="display" style={{ fontSize: 18, fontWeight: 700 }}>{drawerShop.name}</div>
                <div style={{ fontSize: 12, color: "var(--mute)" }}>{drawerShop.area} · {drawerShop.cat}</div>
              </div>
              <button className="icon-btn" onClick={() => setDrawerShop(null)}>✕</button>
            </div>
            <div style={{ padding: 20, overflowY: "auto", flex: 1 }}>
              <div className="kpis" style={{ gridTemplateColumns: "1fr 1fr", marginBottom: 16 }}>
                <div className="kpi"><div className="kpi-k">Trust score</div><div className="kpi-v">{drawerShop.trust}</div></div>
                <div className="kpi"><div className="kpi-k">7d orders</div><div className="kpi-v">{drawerShop.orders}</div></div>
                <div className="kpi"><div className="kpi-k">7d revenue</div><div className="kpi-v">{formatINR(drawerShop.rev)}</div></div>
                <div className="kpi"><div className="kpi-k">Status</div><div className="kpi-v" style={{ color: drawerShop.online ? "var(--success)" : "var(--mute)" }}>{drawerShop.online ? "Online" : "Offline"}</div></div>
              </div>

              <div className="form-row">
                <label>Display name</label>
                <input defaultValue={drawerShop.name} />
              </div>
              <div className="form-row">
                <label>Category</label>
                <select defaultValue={drawerShop.cat}>
                  {["Grocery","Vegetables","Dairy","Bakery","Snacks","Pharmacy","Stationery"].map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-row">
                <label>Area / address</label>
                <input defaultValue={drawerShop.area} />
              </div>
              <div className="form-row">
                <label>Operational status</label>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <button className={`toggle ${drawerShop.online ? "on" : ""}`}
                          onClick={() => { toggleOnline(drawerShop.id, drawerShop.online); setDrawerShop({ ...drawerShop, online: !drawerShop.online }); }} />
                  <span style={{ fontSize: 12.5, color: "var(--mute)" }}>
                    {drawerShop.online ? "Visible in app — accepting orders" : "Hidden — not accepting orders"}
                  </span>
                </div>
              </div>

              <div style={{ marginTop: 14, padding: 14, background: "var(--paper)", borderRadius: 10, border: "1px solid var(--line)" }}>
                <div style={{ fontSize: 12.5, fontWeight: 600 }}>Recent flags</div>
                <div style={{ fontSize: 12, color: "var(--mute)", marginTop: 4 }}>
                  No active complaints. Last review reply: 3 days ago.
                </div>
              </div>
            </div>
            <div style={{ padding: 14, borderTop: "1px solid var(--line)", display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button className="ghost-btn">Suspend</button>
              <button className="primary-btn">Save changes</button>
            </div>
          </>
        )}
      </div>
    </>
  );
}

function ListSection({ title, subtitle, resource, renderRows, emptyLabel, onRetry }) {
  if (resource.loading) return <LoadingCard title={`Loading ${title.toLowerCase()}…`} />;
  if (resource.error) return <ErrorCard error={resource.error} onRetry={onRetry || resource.reload} />;
  const rows = renderRows();
  return (
    <>
      <div className="h1-row">
        <div>
          <div className="h1">{title}</div>
          <div className="h1-sub">{subtitle}</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="ghost-btn" onClick={resource.reload}>Refresh</button>
        </div>
      </div>
      <div className="card" style={{ padding: 0 }}>
        {rows.length ? rows : <div className="empty">{emptyLabel}</div>}
      </div>
    </>
  );
}

function VerificationsSection() {
  const resource = useApiResource(() => apiRequest("admin/kyc/queue", { params: { page: 1, limit: 50 } }), []);
  async function act(id, mode) {
    const payload = mode === "approve"
      ? { notes: "Approved from standalone admin dashboard prototype" }
      : { reason: "Rejected from standalone admin dashboard prototype pending corrected documents." };
    await apiRequest(`admin/kyc/${id}/${mode}`, { method: "PATCH", body: payload });
    resource.reload();
  }
  return (
    <ListSection
      title="Verifications"
      subtitle="Loaded from /admin/kyc/queue"
      resource={resource}
      emptyLabel="No KYC submissions returned."
      renderRows={() => (resource.data?.kyc_queue || []).map(item => (
        <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderTop: "1px solid var(--line-2)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700 }}>{item.shop_name}</div>
            <div className="shop-loc">{item.owner_name} · {item.owner_phone} · {item.status}</div>
          </div>
          <button className="ghost-btn" onClick={() => act(item.id, "reject")}>Reject</button>
          <button className="primary-btn" onClick={() => act(item.id, "approve")}>Approve</button>
        </div>
      ))}
    />
  );
}

function RidersSection() {
  const resource = useApiResource(() => apiRequest("admin/delivery-partners", { params: { page: 1, limit: 50 } }), []);
  return (
    <ListSection
      title="Riders"
      subtitle="Loaded from /admin/delivery-partners"
      resource={resource}
      emptyLabel="No delivery partners returned."
      renderRows={() => (resource.data?.delivery_partners || []).map(item => (
        <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderTop: "1px solid var(--line-2)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700 }}>{item.name}</div>
            <div className="shop-loc">{item.phone} · {item.status} · ⭐ {Number(item.rating || 0).toFixed(1)}</div>
          </div>
          <div className="mono">{formatINR(item.total_earnings || 0)}</div>
        </div>
      ))}
    />
  );
}

function OrdersSection() {
  const resource = useApiResource(() => apiRequest("admin/orders/live", { params: { limit: 50 } }), []);
  async function escalate(id) {
    await apiRequest(`admin/orders/${id}/escalate`, { method: "POST" });
    resource.reload();
  }
  return (
    <ListSection
      title="Orders"
      subtitle="Loaded from /admin/orders/live"
      resource={resource}
      emptyLabel="No live orders returned."
      renderRows={() => (resource.data?.orders || []).map(item => (
        <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderTop: "1px solid var(--line-2)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700 }}>{item.id}</div>
            <div className="shop-loc">{item.status} · pending {item.pending_minutes || 0} min · accepted {item.accepted_minutes || 0} min</div>
          </div>
          {item.is_stuck && <span className="pill red">Stuck</span>}
          <button className="ghost-btn" onClick={() => escalate(item.id)}>Escalate</button>
        </div>
      ))}
    />
  );
}

function ModerationSection() {
  const resource = useApiResource(() => apiRequest("admin/moderation/queue", { params: { page: 1, limit: 50 } }), []);
  async function approve(item) {
    await apiRequest(`admin/moderation/${item.id}/approve`, { method: "POST", body: { content_type: item.content_type } });
    resource.reload();
  }
  async function remove(item) {
    await apiRequest(`admin/moderation/${item.id}/remove`, { method: "POST", body: { content_type: item.content_type, reason: "Removed from standalone admin dashboard prototype" } });
    resource.reload();
  }
  return (
    <ListSection
      title="Moderation"
      subtitle="Loaded from /admin/moderation/queue"
      resource={resource}
      emptyLabel="No flagged content returned."
      renderRows={() => (resource.data?.moderation_queue || []).map(item => (
        <div key={`${item.content_type}-${item.id}`} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderTop: "1px solid var(--line-2)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700 }}>{item.content_type} · {item.id}</div>
            <div className="shop-loc">{item.content} · flags {item.flag_count}</div>
          </div>
          <button className="ghost-btn" onClick={() => approve(item)}>Approve</button>
          <button className="primary-btn" onClick={() => remove(item)}>Remove</button>
        </div>
      ))}
    />
  );
}

function BroadcastSection() {
  const resource = useApiResource(() => apiRequest("admin/broadcast/history", { params: { page: 1, limit: 20 } }), []);
  const [form, setForm] = React.useState({
    title: "NearBy update",
    body: "This is a broadcast message from the standalone admin dashboard prototype.",
    target: "customers",
  });

  async function createBroadcast() {
    await apiRequest("admin/broadcast", { method: "POST", body: form });
    resource.reload();
  }

  if (resource.loading) return <LoadingCard title="Loading broadcast history…" />;
  if (resource.error) return <ErrorCard error={resource.error} onRetry={resource.reload} />;

  return (
    <>
      <div className="h1-row">
        <div>
          <div className="h1">Settings & Broadcast</div>
          <div className="h1-sub">Configure API credentials and send broadcasts through backend APIs</div>
        </div>
      </div>
      <div className="grid-2" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <SettingsSection compact />
        <div className="card" style={{ padding: 18 }}>
          <div className="card-title">Broadcast composer</div>
          <div className="form-row" style={{ marginTop: 14 }}>
            <label>Title</label>
            <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
          </div>
          <div className="form-row">
            <label>Body</label>
            <input value={form.body} onChange={(e) => setForm({ ...form, body: e.target.value })} />
          </div>
          <div className="form-row">
            <label>Target</label>
            <select value={form.target} onChange={(e) => setForm({ ...form, target: e.target.value })}>
              <option value="customers">Customers</option>
              <option value="shops">Shops</option>
              <option value="delivery">Delivery</option>
            </select>
          </div>
          <button className="primary-btn" onClick={createBroadcast}>Queue broadcast</button>
        </div>
      </div>
      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-hd">
          <div>
            <div className="card-title">Broadcast history</div>
            <div className="card-sub">Loaded from /admin/broadcast/history</div>
          </div>
        </div>
        {(resource.data?.broadcasts || []).map(item => (
          <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderTop: "1px solid var(--line-2)" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700 }}>{item.title}</div>
              <div className="shop-loc">{item.target} · {item.status} · sent {item.sent_count || 0}</div>
            </div>
            <div className="mono">{new Date(item.created_at).toLocaleDateString("en-IN")}</div>
          </div>
        ))}
      </div>
    </>
  );
}

function SettingsSection({ compact = false }) {
  const [apiBase, setApiBase] = React.useState(localStorage.getItem("nearby_admin_api_base_url") || DEFAULT_API_BASE);
  const [token, setToken] = React.useState(getAdminToken());
  function save() {
    setAdminApiBase(apiBase);
    setAdminToken(token);
    alert("Saved admin API configuration to localStorage.");
  }
  return (
    <div className="card" style={{ padding: compact ? 18 : 24 }}>
      <div className="card-title">API configuration</div>
      <div className="card-sub" style={{ marginTop: 4 }}>Use a valid admin bearer token from your backend auth flow.</div>
      <div className="form-row" style={{ marginTop: 16 }}>
        <label>API base URL</label>
        <input value={apiBase} onChange={(e) => setApiBase(e.target.value)} />
      </div>
      <div className="form-row">
        <label>Admin bearer token</label>
        <input value={token} onChange={(e) => setToken(e.target.value)} />
      </div>
      <button className="primary-btn" onClick={save}>Save configuration</button>
    </div>
  );
}

// ─── Root ───────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "regular",
  "showLiveOps": true
}/*EDITMODE-END*/;

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const [section, setSection] = React.useState("overview");
  const [shops, setShops] = React.useState(ALL_SHOPS);
  const [featured, setFeatured] = React.useState(FEATURED_SEED);
  const [trending, setTrending] = React.useState(TRENDING_SEED);

  let body;
  if (section === "overview") body = <Overview />;
  else if (section === "shops") body = <ShopsSection shops={shops} setShops={setShops} />;
  else if (section === "riders") body = <RidersSection />;
  else if (section === "orders") body = <OrdersSection />;
  else if (section === "featured") body = <FeaturedTrending mode="featured" picks={featured} setPicks={setFeatured} allShops={shops} />;
  else if (section === "trending") body = <FeaturedTrending mode="trending" picks={trending} setPicks={setTrending} allShops={shops} />;
  else if (section === "verifications") body = <VerificationsSection />;
  else if (section === "moderation") body = <ModerationSection />;
  else if (section === "settings") body = <BroadcastSection />;
  else body = (
    <>
      <div className="h1-row">
        <div>
          <div className="h1">{section[0].toUpperCase() + section.slice(1)}</div>
          <div className="h1-sub">This area is wired to the same data layer — pick another section in the sidebar to explore.</div>
        </div>
      </div>
      <div className="card" style={{ padding: 40, textAlign: "center", color: "var(--mute)" }}>
        <div style={{ fontSize: 38, marginBottom: 8 }}>🛠</div>
        <div className="display" style={{ fontSize: 18, fontWeight: 700, color: "var(--ink)" }}>Coming next</div>
        <div style={{ marginTop: 6, fontSize: 13 }}>Riders · Orders · Verifications · Moderation · Settings.</div>
      </div>
    </>
  );

  return (
    <div className="nb-shell">
      <Sidebar section={section} setSection={setSection} totalPending={4} />
      <div>
        <TopBar section={section} />
        <div className="main">{body}</div>
      </div>

      <TweaksPanel title="Admin Tweaks">
        <TweakSection label="Sidebar density" />
        <TweakRadio value={t.density}
          options={[
            { value: "regular", label: "Regular" },
            { value: "compact", label: "Compact" },
          ]}
          onChange={v => setT('density', v)} />

        <TweakSection label="Overview" />
        <TweakToggle label="Show live-ops alerts" value={t.showLiveOps}
          onChange={v => setT('showLiveOps', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
